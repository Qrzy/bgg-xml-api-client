name: Commit message lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  commitlint:
    name: Check commit messages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run commitlint on range
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FROM=${{ github.event.pull_request.base.sha }}
            TO=${{ github.event.pull_request.head.sha }}
          else
            FROM=${{ github.event.before }}
            TO=${{ github.sha }}
          fi

          # Guard: skip when no range available or identical commits
          if [ -z "$FROM" ] || [ "$FROM" = "0000000000000000000000000000000000000000" ] || [ "$FROM" = "$TO" ]; then
            echo "No commit range to lint; skipping."
            exit 0
          fi

          echo "Checking commits from $FROM to $TO"
          pnpm exec commitlint --from=$FROM --to=$TO
